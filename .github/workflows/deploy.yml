name: Deploy Dollarino to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Core & Web Assets
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - name: Check Cloudflare Credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure D1 Database Exists & Sync database_id
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          DB_ID=$(npx wrangler d1 list --json | node -e '
            const list = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const db = list.find((d) => d.name === "dollarino-db");
            if (db && db.uuid) process.stdout.write(db.uuid);
          ')
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database dollarino-db..."
            npx wrangler d1 create dollarino-db
            DB_ID=$(npx wrangler d1 list --json | node -e '
              const list = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const db = list.find((d) => d.name === "dollarino-db");
              if (db && db.uuid) process.stdout.write(db.uuid);
            ')
          fi
          if [ -z "$DB_ID" ]; then
            echo "Failed to resolve dollarino-db UUID" >&2
            exit 1
          fi
          echo "Resolved dollarino-db UUID: $DB_ID"
          node -e '
            const fs = require("fs");
            const dbId = process.argv[1];
            const toml = fs.readFileSync("wrangler.toml", "utf8");
            const updated = toml.replace(/database_id\s*=\s*"[^"]*"/, `database_id = "${dbId}"`);
            fs.writeFileSync("wrangler.toml", updated);
          ' "$DB_ID"
      - name: Apply D1 Migrations (Remote)
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx wrangler d1 migrations apply dollarino-db --remote
      - name: Deploy Cloudflare Worker (API + DO + Assets)
        id: worker
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          DEPLOY_OUT=$(npx wrangler deploy 2>&1 | tee /dev/stderr)
          WORKER_URL=$(printf '%s\n' "$DEPLOY_OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || true)
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker URL: $WORKER_URL"
      - name: Sync Optional Worker Runtime Secrets
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_JWT_SECRET: ${{ secrets.SESSION_JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HILINKUP_API_KEY: ${{ secrets.HILINKUP_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          for KEY in SESSION_JWT_SECRET MASTER_ENCRYPTION_KEY TELEGRAM_BOT_TOKEN HILINKUP_API_KEY; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              printf '%s' "$VAL" | npx wrangler secret put "$KEY"
            fi
          done
      - name: Configure Cloudflare Pages Service Binding & Build Settings
        id: pages_cfg
        if: steps.cf.outputs.enabled == 'true' && vars.SKIP_PAGES_DEPLOY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dolarino' }}
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "patch_status=skipped_no_account_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATCH_RESULT=$(node -e '
            const acc = process.env.CLOUDFLARE_ACCOUNT_ID;
            const proj = process.env.PAGES_PROJECT || "dolarino";
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const workerUrl = process.env.WORKER_URL || "";
            const envVars = workerUrl ? { WORKER_URL: { type: "plain_text", value: workerUrl } } : {};
            const services = { WORKER_API: { service: "dollarino-worker", environment: "production" } };
            const body = {
              build_config: {
                build_command: "npm run build",
                destination_dir: "apps/web/dist",
                root_dir: ""
              },
              deployment_configs: {
                production: { services, env_vars: envVars },
                preview: { services, env_vars: envVars }
              }
            };
            (async () => {
              const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${acc}/pages/projects/${proj}`, {
                method: "PATCH",
                headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
              });
              const json = await res.json().catch(() => ({}));
              const errMsg = (json.errors || []).map(e => `${e.code}:${e.message}`).join(";");
              process.stdout.write(`http=${res.status},ok=${Boolean(json.success)}${errMsg ? `,err=${errMsg}` : ""}`);
            })();
          ')
          echo "patch_status=$PATCH_RESULT" >> "$GITHUB_OUTPUT"
          echo "Pages PATCH: $PATCH_RESULT"
      - name: Deploy Cloudflare Pages Frontend + Functions Proxy
        if: steps.cf.outputs.enabled == 'true' && vars.SKIP_PAGES_DEPLOY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dolarino' }}
        working-directory: apps/web
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx wrangler pages deploy ./dist --project-name="$PAGES_PROJECT" --branch=main
      - name: Verify Live Deployment & Register Direct Worker Telegram Webhook
        if: steps.cf.outputs.enabled == 'true'
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dolarino' }}
          WORKER_URL: ${{ steps.worker.outputs.url }}
          PAGES_PATCH_STATUS: ${{ steps.pages_cfg.outputs.patch_status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HILINKUP_API_KEY: ${{ secrets.HILINKUP_API_KEY }}
        run: |
          node -e '
            (async () => {
              const pagesUrl = `https://${process.env.PAGES_PROJECT || "dolarino"}.pages.dev`;
              const workerUrl = (process.env.WORKER_URL || "").replace(/\/+$/, "");
              const tgToken = (process.env.TELEGRAM_BOT_TOKEN || "").trim();
              const hlkKey = (process.env.HILINKUP_API_KEY || "").trim();
              const diag = [];
              diag.push(`worker_url=${workerUrl || "NONE"}`);
              diag.push(`pages_patch=${process.env.PAGES_PATCH_STATUS || "NONE"}`);

              let workerOk = false;
              if (workerUrl) {
                try {
                  const r = await fetch(`${workerUrl}/api/health`);
                  const txt = await r.text();
                  workerOk = r.ok && txt.includes("\"ok\":true");
                  diag.push(`worker_health=${r.status}:${workerOk}`);
                } catch (e) {
                  diag.push(`worker_health=ERR:${e.message}`);
                }
              }

              let pagesOk = false;
              try {
                const r = await fetch(`${pagesUrl}/api/health`);
                const txt = await r.text();
                pagesOk = r.ok && txt.includes("\"ok\":true");
                diag.push(`pages_health=${r.status}:${pagesOk}`);
              } catch (e) {
                diag.push(`pages_health=ERR:${e.message}`);
              }

              // Check Hilinkup live models & AI chat
              diag.push(`hlk_secret=${Boolean(hlkKey)}`);
              if (hlkKey) {
                try {
                  const r = await fetch("https://api.hilinkup.com/v1/models", {
                    headers: { Authorization: `Bearer ${hlkKey}`, Accept: "application/json" }
                  });
                  const txt = await r.text();
                  let models = [];
                  try { models = (JSON.parse(txt).data || []).map(m => m.id).slice(0, 6); } catch {}
                  diag.push(`hlk_models_http=${r.status}:[${models.join(",")}]`);
                } catch (e) {
                  diag.push(`hlk_models=ERR:${e.message}`);
                }
              }

              const aiBase = pagesOk ? pagesUrl : workerUrl;
              if (aiBase) {
                try {
                  const r = await fetch(`${aiBase}/api/public/ai-chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "سلام تست کوتاه" })
                  });
                  const j = await r.json().catch(() => ({}));
                  diag.push(`ai_chat=${r.status}:${j.modelId || "?"}:${j.modelName || "?"}`);
                } catch (e) {
                  diag.push(`ai_chat=ERR:${e.message}`);
                }
              }

              // Register Telegram Webhook DIRECTLY on Worker URL (most reliable!)
              diag.push(`tg_secret=${Boolean(tgToken)}`);
              if (tgToken) {
                try {
                  const meRes = await fetch(`https://api.telegram.org/bot${tgToken}/getMe`);
                  const me = await meRes.json().catch(() => ({}));
                  diag.push(`tg_me=${me.ok ? "@" + (me.result && me.result.username) : "ERR:" + (me.description || meRes.status)}`);

                  const webhookBase = workerUrl || pagesUrl;
                  const webhookUrl = `${webhookBase}/api/webhook/telegram`;
                  const setRes = await fetch(`https://api.telegram.org/bot${tgToken}/setWebhook`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      url: webhookUrl,
                      allowed_updates: ["message", "callback_query", "channel_post", "my_chat_member"],
                      drop_pending_updates: false
                    })
                  });
                  const setJson = await setRes.json().catch(() => ({}));
                  diag.push(`tg_setWebhook=${setJson.ok}:${webhookUrl}${setJson.ok ? "" : ":" + setJson.description}`);

                  await fetch(`https://api.telegram.org/bot${tgToken}/setChatMenuButton`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      menu_button: { type: "web_app", text: "پنل دلارینو", web_app: { url: pagesOk ? pagesUrl : webhookBase } }
                    })
                  }).catch(() => {});

                  // Verify webhook with a synthetic ping & read getWebhookInfo
                  const infoRes = await fetch(`https://api.telegram.org/bot${tgToken}/getWebhookInfo`);
                  const info = await infoRes.json().catch(() => ({}));
                  if (info.ok && info.result) {
                    diag.push(`tg_wh_url=${info.result.url || "EMPTY"}`);
                    diag.push(`tg_pending=${info.result.pending_update_count ?? 0}`);
                    if (info.result.last_error_message) {
                      diag.push(`tg_last_err=${info.result.last_error_message}`);
                    }
                  }
                } catch (e) {
                  diag.push(`tg_err=${e.message}`);
                }
              }

              const summary = diag.join(" | ");
              console.log(`::notice title=Live Deploy Diagnostics::${summary}`);
              if (!workerOk && !pagesOk) {
                process.exit(1);
              }
            })();
          '
